name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: verify tag & changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tag matches Cargo.toml & CHANGELOG.md
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          PKG_VER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${PKG_VER}" >&2
            exit 1
          fi
          grep -qE "^## \[?${PKG_VER}\]?([[:space:]]|$)" CHANGELOG.md \
            || { echo "error: CHANGELOG.md missing heading for ${PKG_VER}" >&2; exit 1; }

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            test: true
          - target: x86_64-apple-darwin
            os: macos-15
            test: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            test: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            test: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            test: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            test: true
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            test: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - name: Test on native host
        if: matrix.test
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          T: ${{ matrix.target }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION=dev; fi
          NAME="grace-${VERSION}-${T}"
          mkdir -p "dist/${NAME}"
          cp "target/${T}/release/grace" README.md LICENSE "dist/${NAME}/"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          else
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          T: ${{ matrix.target }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          $name = "grace-$version-$env:T"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/$env:T/release/grace.exe", README.md, LICENSE -Destination "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/dist/$name.zip.sha256", "$hash  $name.zip`n")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grace-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          (cd dist && sha256sum *.tar.gz *.zip | LC_ALL=C sort > SHA256SUMS.txt)
      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          awk -v ver="$VER" '
            /^## / {
              if (found) exit
              hdr = $0
              sub(/^## \[?/, "", hdr)
              sub(/\].*$/, "", hdr)
              sub(/[[:space:]].*$/, "", hdr)
              if (hdr == ver) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > changelog_section.md || true

          {
            if [ -s changelog_section.md ]; then
              cat changelog_section.md
              echo ""
            else
              echo "grace is a fast Site of Grace for project navigation, AI coding tools, and tmux workspaces."
              echo ""
            fi
            cat <<EOF
          ### Downloads

          | Your system | Download |
          |---|---|
          | macOS Apple Silicon | \`grace-${TAG}-aarch64-apple-darwin.tar.gz\` |
          | macOS Intel | \`grace-${TAG}-x86_64-apple-darwin.tar.gz\` |
          | Linux x86_64 (static musl) | \`grace-${TAG}-x86_64-unknown-linux-musl.tar.gz\` |
          | Linux x86_64 (glibc) | \`grace-${TAG}-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux ARM64 (static musl) | \`grace-${TAG}-aarch64-unknown-linux-musl.tar.gz\` |
          | Linux ARM64 (glibc) | \`grace-${TAG}-aarch64-unknown-linux-gnu.tar.gz\` |
          | Windows x86_64 | \`grace-${TAG}-x86_64-pc-windows-msvc.zip\` |
          | Windows ARM64 | \`grace-${TAG}-aarch64-pc-windows-msvc.zip\` |

          Verify downloads using \`SHA256SUMS.txt\` or per-archive \`.sha256\` files.

          Quick setup:
          \`\`\`sh
          # zsh
          eval "\$(grace init zsh)"
          # bash
          eval "\$(grace init bash)"
          # fish
          grace init fish | source
          # PowerShell
          Invoke-Expression (& grace init powershell | Out-String)
          \`\`\`
          EOF
          } > notes.md
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "grace $TAG" --notes-file notes.md --verify-tag dist/*
          fi

  homebrew:
    name: update the Homebrew tap
    needs: release
    # Skip pre-releases such as v2.1.0-rc1.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Check for the tap key
        id: key
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::HOMEBREW_TAP_KEY is not set. The tap was not updated."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.key.outputs.ok
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.key.outputs.ok
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.key.outputs.ok
        with:
          repository: prathameshk421/homebrew-grace
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap
      - name: Write the formula and push it
        if: steps.key.outputs.ok
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .github/scripts/formula.sh "$TAG" dist > tap/Formula/grace.rb
          cd tap
          if git diff --quiet; then
            echo "The formula is already at $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "grace ${TAG#v}"
          git push
