[package]
name = "grace"
version = "2.0.1"
edition = "2021"
description = "Fast travel between your project folders, with tags for the AI tools you used there."
license = "MIT"
repository = "https://github.com/prathameshk421/grace"

[[bin]]
name = "grace"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
nucleo-matcher = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
