[package]
name = "grace"
version = "2.3.0"
edition = "2021"
rust-version = "1.89"
description = "Fast travel between your project folders, with tags for the AI tools you used there."
license = "MIT"
repository = "https://github.com/prathameshk421/grace"

[[bin]]
name = "grace"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "color"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
nucleo-matcher = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"
unicode-segmentation = "1.13"
unicode-width = "0.2.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = "s"
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"
