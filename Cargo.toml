[package]
name = "grace"
version = "1.0.0"
edition = "2021"
description = "Fast travel between your project folders, with tags for the AI tools you used there."
license = "MIT"
repository = "https://github.com/prathameshk421/grace"

[[bin]]
name = "grace"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
nucleo-matcher = "0.3"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
